<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Imposter Badini - Mega Pack</title>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

        body {
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a1a url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?ixlib=rb-1.2.1&auto=format&fit=crop&w=1351&q=80') no-repeat center center fixed;
            background-size: cover;
            color: white;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            background: rgba(0, 0, 0, 0.85);
            width: 100%;
            max-width: 380px;
            padding: 25px;
            border-radius: 25px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-top: 15px;
        }

        h1 { 
            color: #2ecc71; 
            text-align: center; 
            font-size: 28px; 
            margin-bottom: 20px; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        input, select {
            width: 100%;
            height: 50px;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #444;
            font-size: 16px;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            outline: none;
        }

        button {
            width: 100%;
            height: 50px;
            border-radius: 12px;
            border: none;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            margin-bottom: 10px;
            transition: transform 0.1s;
        }

        button:active { transform: scale(0.98); }

        .add-btn { background: #27ae60; color: white; box-shadow: 0 4px 0 #219150; }
        .start-btn { background: #e67e22; color: white; margin-top: 10px; box-shadow: 0 4px 0 #d35400; }
        .reset-btn { background: #c0392b; color: white; margin-top: 20px; box-shadow: 0 4px 0 #a93226; }
        .next-btn { background: #3498db; color: white; box-shadow: 0 4px 0 #2980b9; }

        .player-list { 
            background: rgba(255,255,255,0.1); 
            border-radius: 12px; 
            margin-bottom: 15px; 
            max-height: 200px; 
            overflow-y: auto; 
            border: 1px solid rgba(255,255,255,0.1);
        }

        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 16px;
        }

        .delete-icon { color: #ff6b6b; font-weight: bold; padding: 5px 10px; cursor: pointer; }

        .card-display {
            background: #f1c40f;
            color: #2c3e50;
            height: 180px;
            border-radius: 20px;
            font-size: 26px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 25px 0;
            text-align: center;
            padding: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <div id="setup-screen">
        <h1>🕵️‍♂️ یارییا خائین</h1>

        <select id="category-select">
            <option value="تەپاپێ">تەپاپێ (یانە و یاریزان)</option>
            <option value="کەسایەتی">کەسایەتیێن ناڤدار</option>
            <option value="تشتێن_ناڤمال">تشتێن ناڤ مالێ</option>
            <option value="خوارن">خوارن و ڤەخوارن</option>
            <option value="ئاژەڵ">ئاژەڵ و گیانەوەر</option>
            <option value="باژێر">باژێر و وەڵات</option>
            <option value="تڕۆمبێل">تڕۆمبێل (New)</option>
            <option value="کار">کار و پیشە (New)</option>
            <option value="بەرنامە">بەرنامە و ئەپ (New)</option>
            <option value="Random">هەمی تێکەل (Random)</option>
        </select>

        <input type="text" id="player-name" placeholder="ناڤێ یاریزانی بنڤیسە..." enterkeyhint="done">
        <button type="button" class="add-btn" id="add-btn-id">زێدە بکە +</button>

        <div id="player-list-ui" class="player-list"></div>

        <button id="start-btn" class="start-btn hidden">دەستپێکرن ▶️</button>
    </div>

    <div id="game-screen" class="hidden">
        <h2 id="turn-name" style="color: #f1c40f; text-align: center; font-size: 22px;"></h2>
        <p style="text-align: center; opacity: 0.8; margin-top: -10px; font-size: 14px;">مۆبایلێ بدە ڤی کەسی و کلیک ل کارتێ بکە:</p>

        <div id="card" class="card-display">نیشان بدە 👁️</div>

        <button id="next-player-btn" class="next-btn hidden">یێ دی لێ بدەت ⏭️</button>

        <div id="finish-area" class="hidden">
            <h3 style="color:#2ecc71; text-align:center; font-size: 24px;">هەمییان دیت! ✅</h3>
            <p style="text-align: center;">نۆکە دەست ب گەنگەشێ بکەن...</p>
            <button class="reset-btn" id="reset-btn-id">دوبارە یاری بکە 🔄</button>
        </div>
    </div>
</div>

<script>
    // لیستا پڕ پەیڤ (Mega Pack)
    const data = {
        "تەپاپێ": [
            "Messi", "Ronaldo", "Neymar", "Mbappe", "Haaland", "Salah", "Benzema", "Vinicius", "Bellingham", "Lewandowski",
            "Lamine Yamal", "Pedri", "Gavi", "De Bruyne", "Kane", "Neuer", "Ter Stegen", "Courtois", "Alisson", "Ederson",
            "Real Madrid", "Barcelona", "Man City", "Liverpool", "Bayern Munich", "PSG", "Man United", "Arsenal", "Chelsea", "Juventus", "AC Milan", "Inter Milan", "Dortmund",
            "نادی زاخۆ", "نادی دهۆک", "نادی هەولێر", "هەڵبژاردێ عیراقێ", "هەڵبژاردێ بەرازیل", "هەڵبژاردێ ئەرجەنتین", "هەڵبژاردێ ئەڵمانیا",
            "گۆڵچی", "حەکەم", "یاریگەهـ", "کۆپا ئەمریکا", "Marcelo", "Modric", "Kroos", "Ramos", "Zidane", "Maradona", "Pele", "Ronaldinho", "R9"
        ],
        "کەسایەتی": [
            "Charles Oliveira", "Elon Musk", "The Rock", "Khabib", "Jackie Chan", "MrBeast", "Spider-Man", "Batman", "Superman",
            "Iron Man", "Tom Cruise", "Justin Bieber", "Eminem", "Conor McGregor", "Mike Tyson", "Muhammad Ali", "Bruce Lee",
            "Donald Trump", "Joe Biden", "Putin", "Zelensky", "Kim Jong Un", "Obama", "Mr. Bean", "Steve Jobs", "Bill Gates", "Mark Zuckerberg",
            "Johnny Depp", "Will Smith", "Harry Potter", "John Wick", "Undertaker", "John Cena", "Mario", "SpongeBob", "Tom & Jerry", "Joker"
        ],
        "تشتێن_ناڤمال": [
            "کورسی", "مێز", "تەلەفزیۆن", "سەلاجە", "سپلیت", "پەردە", "کەوچک", "چەتاڵ", "قاپ", "پەرداخ", "مەنجەڵ", "فڕن",
            "غەسالە", "جارۆکە", "کۆمپیوتەر", "مۆبایل", "ئێستیکان", "بەتانی", "بۆری", "ئاڤدەست", "دەوشەک", "پێنجەرە", "دەرگەهـ", 
            "خەلات", "مەکتەبە", "سۆپا", "پانیکە", "شەحن", "هێدفۆن", "کلیل", "قوفڵ", "چەرخ", "خاولی", "سابین", "شامپۆ", "تەشت", "سەتڵ", "چەکوچ", "بڕغی"
        ],
        "خوارن": [
            "یاپراخ", "کفتە", "پیزا", "بەرگر", "بریانی", "کباب", "ساڤار", "شۆربە", "شیش کباب", "فەلافل", "مەقەلۆبە",
            "برنج و شۆربە", "ماسیا برژى", "مریشک", "پەتاتە", "زەڵاتە", "ماست", "کولا", "چای", "قەهوە", "ئاڤ", "دۆلمە", "سەر و پێ",
            "باجلە", "نیسک", "نۆک", "لۆبی", "قەلی", "تەشریب", "ئیندوومی", "مەعکەرۆنی", "شامی", "باقلاوە", "کولێچە", "کێک", "دۆندرمە",
            "هەنار", "سێڤ", "تڕی", "خەیار", "تەماتە", "پیڤاز", "سیر", "نان", "هێک", "پەنیر"
        ],
        "ئاژەڵ": [
            "شێر", "پڵنگ", "فیل", "کەرۆشک", "پێشی", "سە", "ئەسپ", "میمیک", "کێسەل", "مار", "گورگ", "رێڤی", "ورچ",
            "چێڵ", "بزن", "مەهـ", "کەڵەشێر", "کەفۆک", "دایناسۆر", "نەهەنگ", "قورقورک", "پەز", "مریشک", "مێش", "پێسی",
            "زەرافە", "کەنگەر", "تیمساح", "قرژال", "عەقرەب", "هەسپێ ئاڤێ", "کەر", "هێشتر", "کوچک", "پاق", "قەل", "چەقەل", "مایین"
        ],
        "باژێر": [
            "دهۆک", "هەولێر", "سلێمانی", "زاخۆ", "ئامێدی", "ئاکرێ", "بەغدا", "کەرکوک", "ئیستەنبوڵ", "دوبای", "پاریس",
            "لەندەن", "نیویۆرک", "مەککە", "مەدینە", "ئەڵمانیا", "تورکیا", "ئەمریکا", "کوردستان", "بەرازیل", "ئەرجەنتین",
            "شێلادزێ", "سێمێل", "سۆران", "هەڵەبجە", "موسڵ", "بەسرە", "چین", "یابان", "ڕوسیا", "کەنەدا", "ئوسترالیا", "هندستان", "میسر",
            "بەردەرەش", "شەقلاوە", "بەحرکە"
        ],
        "تڕۆمبێل": [
            "BMW", "Mercedes", "Toyota", "Nissan", "Ford", "Hyundai", "Kia", "Land Cruiser", "Hilux", "Patrol", "Sunny", "Optima",
            "Elantra", "Avalon", "Camry", "G-Class", "Range Rover", "Ferrari", "Lamborghini", "Bugatti", "Tesla", "Jeep", "Chevrolet",
            "تەکسى", "پاس", "لۆری", "تڕێلە", "ماتۆڕ", "پایسکل", "تەیارە", "قیتار", "کەشتی"
        ],
        "کار": [
            "دکتۆر", "مامۆستا", "ئەندازیار", "پۆلیس", "پێشمەرگە", "ئاسایش", "حەلاق", "شۆفێر", "فیتەر", "وەستایێ کەهرەبێ", "وەستایێ خانیێ",
            "پارێزەر", "دادوەر", "بازرگان", "فرۆشیار", "نەجار", "خەیات", "نانپێژ", "قەساب", "فڕۆکەڤان", "یاریزان", "رۆژنامەڤان"
        ],
        "بەرنامە": [
            "TikTok", "Instagram", "Snapchat", "Facebook", "YouTube", "WhatsApp", "Viber", "Telegram", "PUBG", "Free Fire", "Call of Duty",
            "FIFA", "Clash of Clans", "Ludo", "Google", "Netflix", "ChatGPT", "Gemini", "Kurdistan 24", "Rudaw", "FastPay", "Zain Cash"
        ]
    };

    let players = [];
    let gameData = { imposterIndex: -1, word: "", currentIndex: 0 };

    document.getElementById('add-btn-id').addEventListener('click', function() {
        const input = document.getElementById('player-name');
        const name = input.value.trim();
        if (name) {
            players.push(name);
            input.value = "";
            renderPlayers();
        }
    });

    function renderPlayers() {
        const list = document.getElementById('player-list-ui');
        list.innerHTML = players.map((p, i) => `
            <div class="player-item">
                <span>${i + 1}. ${p}</span>
                <span class="delete-icon" onclick="removePlayer(${i})">✖</span>
            </div>
        `).join('');

        const startBtn = document.getElementById('start-btn');
        if (players.length >= 3) {
            startBtn.classList.remove('hidden');
        } else {
            startBtn.classList.add('hidden');
        }
    }

    window.removePlayer = function(i) {
        players.splice(i, 1);
        renderPlayers();
    };

    document.getElementById('start-btn').addEventListener('click', function() {
        const cat = document.getElementById('category-select').value;
        let list = [];

        if (cat === "Random") {
            Object.values(data).forEach(arr => list.push(...arr));
        } else {
            list = data[cat];
        }

        gameData.word = list[Math.floor(Math.random() * list.length)];
        gameData.imposterIndex = Math.floor(Math.random() * players.length);
        gameData.currentIndex = 0;

        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('finish-area').classList.add('hidden');

        showTurn();
    });

    function showTurn() {
        document.getElementById('turn-name').innerText = "نۆکا ( " + players[gameData.currentIndex] + " )";
        const card = document.getElementById('card');
        card.innerText = "نیشان بدە 👁️";
        card.style.background = "#f1c40f";
        card.style.color = "#2c3e50";
        document.getElementById('next-player-btn').classList.add('hidden');
    }

    document.getElementById('card').addEventListener('click', function() {
        const card = this;
        if (card.innerText !== "نیشان بدە 👁️") return;

        if (gameData.currentIndex === gameData.imposterIndex) {
            card.innerText = "تو خائینی! 🤫";
            card.style.background = "#e74c3c";
            card.style.color = "white";
        } else {
            card.innerText = "پەیڤ: 
" + gameData.word;
            card.style.background = "#2ecc71";
            card.style.color = "white";
        }

        if (gameData.currentIndex < players.length - 1) {
            document.getElementById('next-player-btn').classList.remove('hidden');
        } else {
            document.getElementById('finish-area').classList.remove('hidden');
        }
    });

    document.getElementById('next-player-btn').addEventListener('click', function() {
        gameData.currentIndex++;
        showTurn();
    });

    document.getElementById('reset-btn-id').addEventListener('click', function() {
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('setup-screen').classList.remove('hidden');
        gameData.imposterIndex = -1;
        gameData.word = "";
        gameData.currentIndex = 0;
    });

</script>

</body>
</html>
